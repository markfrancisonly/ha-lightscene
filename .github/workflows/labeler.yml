---
name: Manage labels

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  labeler:
    name: Labeler
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Run Labeler
        uses: crazy-max/ghaction-github-labeler@v6
        with:
          skip-delete: true
